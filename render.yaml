databases:
  - name: jp-dating-db
    databaseName: jpdating
    user: jpdating
    plan: free

services:
  - type: web
    name: jp-dating-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api && npm run db:deploy && npm run db:seed
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jp-dating-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: APP_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false

  - type: web
    name: jp-dating-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
