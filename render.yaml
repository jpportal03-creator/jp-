databases:
  - name: jp-dating-db
    databaseName: jpdating
    user: jpdating
    plan: free

services:
  - type: web
    name: jp-dating-api
    rootDir: .
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    preDeployCommand: FAILED_MIGRATION=20260918000000_init; STATUS="$(npx prisma migrate status --schema=apps/api/prisma/schema.prisma 2>&1 || true)"; printf '%s\n' "$STATUS"; if printf '%s\n' "$STATUS" | grep -Fqi 'failed' && printf '%s\n' "$STATUS" | grep -Fq "$FAILED_MIGRATION"; then npx prisma migrate resolve --rolled-back "$FAILED_MIGRATION" --schema=apps/api/prisma/schema.prisma; fi; npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npm run db:seed
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jp-dating-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: APP_URL
        sync: false
      - key: WEB_ORIGINS
        value: https://jp-dating-frontend.onrender.com
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: jp-dating-web
    rootDir: .
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
